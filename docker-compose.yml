services:
  mongodb:
    image: mongo:7
    container_name: fdgsms-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - fdgsms-net

  server:
    build: ./server
    container_name: fdgsms-server
    restart: unless-stopped
    ports:
      - "5000:4000"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB:-fdgsms}?authSource=admin
      CLIENT_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SECRET_KEY: ${AI_SECRET_KEY:-}

    depends_on:
      - mongodb
    networks:
      - fdgsms-net
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.fdgsms-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.fdgsms-api.entrypoints=web,websecure"
      - "traefik.http.routers.fdgsms-api.tls=true"
      - "traefik.http.routers.fdgsms-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.fdgsms-api.priority=100"
      - "traefik.http.services.fdgsms-api.loadbalancer.server.port=4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: fdgsms-client
    restart: unless-stopped
    ports:
      - "5175:3000"
    depends_on:
      - server
    networks:
      - fdgsms-net
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.fdgsms.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.fdgsms.entrypoints=web,websecure"
      - "traefik.http.routers.fdgsms.tls=true"
      - "traefik.http.routers.fdgsms.tls.certresolver=mytlschallenge"
      - "traefik.http.services.fdgsms.loadbalancer.server.port=3000"

networks:
  fdgsms-net:
    driver: bridge
  n8n_default:
    external: true

volumes:
  mongo_data:
